# Область сметных сборников по дисциплинам работ.
#
# ЗАЧЕМ: подбор нормы по одному лексическому сходству ставит «Бестраншейную прокладку
# в полосе отвода железных дорог» первой для кабеля U/UTP, а «Установку гипсовых
# штучных розеток» — для компьютерной розетки. Сборник, из которого взята норма,
# сам по себе является сильным признаком применимости.
#
# ОТКУДА: названия сборников — официальные, из поля `source_doc` нормативной базы
# ФСНБ-2022 («Сборник 10. Оборудование связи»). Здесь не изобретается классификация,
# а фиксируется, какие сборники относятся к дисциплине.
#
# КАК ЧИТАТЬ:
#   primary — сборник профильный: норма оттуда почти всегда уместна;
#   related — смежный: уместен для сопутствующих работ (трассы, проходки, отделка
#             после монтажа), но уступает профильному;
# ЭТО ПОЯСНЕНИЕ, А НЕ ВЕС. Замер на 542 строках готовых смет показал, что сборник как
# слагаемое оценки роняет точность первой позиции с 74,0 % до 71,0 %: признак слишком
# груб, профильный сборник содержит сотни норм. Вес даёт практика раздела.
#
#   всё остальное — за областью дисциплины. Это не запрет: если профильных норм не
#   нашлось, кандидат остаётся, но с явной пометкой в листе проверки.
#
# markers — признаки дисциплины в тексте работы. Регистр не важен, поиск по подстроке.
#
# ИМЕНА: те же, что у разделов в `smeta_section_taxonomy.yaml`. Раздел документа и
# область сборников должны называться одинаково, иначе вес практики (`estimate_usage`)
# не находит свой раздел. `concrete` и `earthworks` разделами не порождаются, но
# остаются: по ним распознаётся дисциплина, когда раздел неизвестен.
#
# Составы `primary` для охранных, пожарных, информационных систем, автоматизации и
# технологических решений выведены из корпуса применений (90 460 строк архива):
# указаны сборники, дающие основную долю применений раздела.
