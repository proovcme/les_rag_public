# Разделы проекта по наименованиям локальных смет.
#
# ОТКУДА. Объектные сметы перечисляют локальные расчёты парами «номер → наименование»
# («01-01-17.1и1 → Демонтаж. Структурированная кабельная система»). В архиве 177 таких
# смет и 697 пар, 237 различных систем. Наименования писали люди русскими словами,
# поэтому раздел определяется по ним, а не по шифру в имени файла.
#
# КАК ЧИТАТЬ. Первое слово наименования — вид работ (демонтаж, монтаж, ПНР), дальше
# система. Тип затрат («Оборудование», «ЗИП», «ПО») разделом не является: он относится
# к системе, названной следом, поэтому такие префиксы отбрасываются до сопоставления.
#
# Порядок разделов важен: побеждает первый, чьи признаки нашлись. Пожарная автоматика
# стоит выше охранных систем, иначе «Автоматизация противопожарной защиты» уходит в
# охрану по слову «система».
version: 1

# Вид работ из первого сегмента номера сметы. 01, 02 и 09 названы владельцем;
# 08 и 14 выведены из архива: под 08 идут временные здания и ПОС (81 смета),
# под 14 — немонтируемое оборудование, мебель и ЗИП (388 смет).
work_kinds:
  "01": demolition
  "02": installation
  "08": temporary
  "09": commissioning
  "14": equipment

# Префиксы наименования, которые говорят о типе затрат, а не о разделе.
cost_prefixes:
  - демонтаж
  - монтаж
  - монтажные работы
  - пнр
  - пусконаладочные работы
  - оборудование
  - зип
  - по
  - программное обеспечение

