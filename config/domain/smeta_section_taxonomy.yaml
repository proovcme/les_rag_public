# Резерв: шифр раздела в имени файла. Нужен там, где наименование называет только вид
# работ («Демонтаж. Дополнительные работы»). Список выведен из архива и оставлены лишь
# шифры, у которых раздел совпал во всех файлах, где наименование его называет прямо:
# АР 259/259, СЗИ 178/178, СКУД 70/70, ОВ2 44/44, АИС 29/29 и так далее.
# ЗИП, ПНР, ПО и ОС сюда не входят: это вид затрат и тип документа, а не раздел.
file_codes:
  communications: [СКС, СПД, БСПД, ЕВСПД, ЛВС, ТЛФ, АТС, СУКС]
  security: [СЗИ, СКУД, СОТ, ООС, КИТСО, ИТСО, ГИС, ОТПБ, СТВ, ЗП, ИБ, ПЗУ]
  fire_safety: [АУПС, АППЗ, АГПТ, АУВПТ, СОУЭ, ВПВ, АВТ]
  hvac: [ОВ, ОВ1, ОВ2, ОВИК, ХС]
  plumbing: [ВК]
  electrical: [ЭОМ, ЭМ]
  automation: [АК, АО, АИС, АСЗ]
  technology: [ТХ, ПУА]
  architecture: [АР, ВО, ДП, МФЗ]
  organization: [ПОС, КППЛК]
