meta:
  version: 1
  title: "Служебные источники Л.Е.С."
  note: "Реестр файлов и датасетов, без которых сметные и нормоконтрольные workflow становятся неполными."

sources:
  - id: gesn_base
    domain: smeta
    label: "ГЭСН-2022: нормы и ресурсы"
    status_if_missing: blocking
    paths:
      - data/smeta_base/les_smeta_base_v2.sqlite
      - data/smeta_base/les_smeta_base_v2_manifest.json
      - data/gesn_base/gesn2022_typed_v2.parquet
      - config/domain/gesn_seed.yaml
    folders:
      - data/smeta_base
      - data/gesn_base
    accepted_files: ["*.sqlite", "*.parquet", "*.json", "*.xlsx", "*.csv", "*.pdf"]
    needed_for:
      - "ГЭСН-код → ресурсы"
      - "ЛСР от нормы"
      - "объектная прикидка"
    operator_action: "Активная база задаётся config/domain/smeta_base_active.json. v2 строится sibling-пайплайном из typed FGIS rows; v1 остаётся только quarantine/audit."
    process_label: "Проверить ГЭСН"
    structured_base_path: data/smeta_base/les_smeta_base_v2.sqlite
    base_manifest_path: data/smeta_base/les_smeta_base_v2_manifest.json
    integrity_report: data/smeta_base/les_smeta_base_v2_integrity.json
    integrity_required: true

  - id: fgis_price_base
    domain: smeta
    label: "ФГИС ЦС: Сплит-формы цен"
    status_if_missing: degraded
    paths:
      - data/price_base/*.parquet
      - config/domain/pricebook_manifest.json
    folders:
      - data/price_base
    accepted_files: ["*.xlsx", "*.parquet"]
    needed_for:
      - "цены ресурсов по коду"
      - "ресурсно-индексный расчёт"
      - "понимание, нужен ли КАЦ"
    operator_action: "Положи сплит-формы цен нужного региона и квартала в папку цен. ЛЕС не ходит за ними в интернет во время расчёта."
    process_label: "Проверить цены"

  - id: smeta_coefficients
    domain: smeta
    label: "Сметные коэффициенты и правила"
    status_if_missing: blocking
    paths:
      - config/domain/nr_sp.yaml
      - config/domain/stesnennost.yaml
      - config/domain/smeta_ontology.yaml
    folders:
      - config/domain
    accepted_files: ["*.yaml"]
    needed_for:
      - "НР/СП"
      - "коэффициенты стеснённости"
      - "сметная онтология"
    operator_action: "Проверяются служебные YAML: НР/СП, стеснённость и сметная онтология."
    process_label: "Проверить правила"

  - id: fsem_catalog
    domain: smeta
    label: "ФСЭМ-2022: машины и машинисты"
    status_if_missing: degraded
    paths:
      - data/smeta_base/fsem_2022.sqlite
      - data/smeta_base/fsem_2022_manifest.json
    folders:
      - data/smeta_base
    accepted_files: ["*.sqlite", "*.json", "*.pdf"]
    needed_for:
      - "связь машины с кодом и разрядом машиниста"
      - "расчёт ОТм отдельно от эксплуатации машины"
      - "проверка нормативных часов экипажа"
    operator_action: "Собери типизированный каталог ФСЭМ и перенеси его вместе с manifest; без него полная стоимость позиции неизвестна."
    process_label: "Проверить ФСЭМ"

  - id: smeta_service_dataset
    domain: smeta
    label: "SMETA_SERVICE: служебный сметный датасет"
    status_if_missing: degraded
    paths:
      - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*.md
      - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*.json
      - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*.parquet
      - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*.xlsx
      - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*.csv
      - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*.pdf
      - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*.docx
    folders:
      - RAG_Content/TABLE_SMETA/SMETA_SERVICE
    accepted_files: ["*.parquet", "*.json", "*.sqlite", "*.xlsx", "*.xlsm", "*.csv", "*.pdf", "*.docx", "*.md", "*.yaml"]
    needed_for:
      - "навигационная карта сметных источников"
      - "Рим/ГЭСН/ФГИС/КАЦ readiness перед сметным ответом"
      - "подсказка оператору, каких служебных документов не хватает"
    operator_action: "Положи постоянные сметные источники в SMETA_SERVICE и нажми Play. Проектные ВОР/ЛСР/КП конкретного объекта сюда не складывать."
    process_label: "Play SMETA_SERVICE"
    required_documents:
      - id: norms
        label: "Нормы и ресурсы"
        requiredness: blocking
        preferred_files: ["*.parquet", "*.json", "*.sqlite"]
        accepted_files: ["*.xlsx", "*.csv", "*.pdf", "*.docx", "*.md"]
        preferred_paths:
          - data/smeta_base/les_smeta_base_v2.sqlite
          - data/gesn_base/gesn2022_typed_v2.parquet
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*norm*.parquet
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*gesn*.json
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*norm*.json
        raw_paths:
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*gesn*.xlsx
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*fer*.xlsx
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*ter*.xlsx
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*gesn*.pdf
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*norm*.md
        needed_for:
          - "поиск норм-кандидатов"
          - "раскрытие ресурсов"
          - "проверка применимости нормы"
      - id: prices
        label: "Цены, ФГИС ЦС, КП/КАЦ и индексы"
        requiredness: degraded
        preferred_files: ["*.parquet", "*.xlsx", "*.csv"]
        accepted_files: ["*.pdf", "*.docx", "*.md"]
        preferred_paths:
          - data/price_base/*.parquet
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*price*.parquet
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*fgis*.xlsx
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*split*.xlsx
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*индекс*.xlsx
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*кац*.xlsx
        raw_paths:
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*кп*.pdf
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*кац*.pdf
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*минстрой*.pdf
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*иф09*.pdf
        needed_for:
          - "ресурсно-индексный расчёт"
          - "понимание MISSING по ценам"
          - "КАЦ/КП добор"
      - id: methodology
        label: "Методика, НР/СП, коэффициенты, правила РИМ"
        requiredness: blocking
        preferred_files: ["*.yaml", "*.json", "*.md"]
        accepted_files: ["*.pdf", "*.docx"]
        preferred_paths:
          - config/domain/nr_sp.yaml
          - config/domain/stesnennost.yaml
          - config/domain/smeta_ontology.yaml
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*method*.md
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*rim*.json
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*коэффициент*.yaml
        raw_paths:
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*421*.pdf
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*рим*.pdf
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*нр*.pdf
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*сп*.pdf
        needed_for:
          - "НР/СП"
          - "коэффициенты"
          - "правила формы ЛСР РИМ"
      - id: forms
        label: "Формы и шаблоны выгрузки"
        requiredness: degraded
        preferred_files: ["*.xlsx"]
        accepted_files: ["*.md", "*.json"]
        preferred_paths:
          - config/forms/templates/*.xlsx
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*lsr*.xlsx
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*лср*.xlsx
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*вор*.xlsx
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*кац*.xlsx
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*кс2*.xlsx
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*кс3*.xlsx
        raw_paths:
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*форма*.md
          - RAG_Content/TABLE_SMETA/SMETA_SERVICE/**/*template*.json
        needed_for:
          - "ЛСР/ВОР/КАЦ/XLSX оформление"
          - "контроль формы результата"

  - id: normcontrol_spds_rulepack
    domain: normcontrol
    label: "СПДС rulepack: ГОСТ Р 21.101-2026"
    status_if_missing: blocking
    paths:
      - config/normcontrol/gost_r_21_101_2026.yaml
    folders:
      - config/normcontrol
    accepted_files: ["*.yaml"]
    needed_for:
      - "doc-review"
      - "карта проверок нормоконтроля"
      - "defense claims по пунктам"
    operator_action: "Rulepack задаёт карту проверок. Текст стандарта нужен отдельно в нормативном RAG-датасете."
    process_label: "Проверить rulepack"

  - id: normcontrol_spds_rag
    domain: normcontrol
    label: "Нормативный RAG: СПДС/ГОСТ Р 21.101"
    status_if_missing: degraded
    dataset_query:
      domains: ["NTD_SPDS", "NTD_GENERAL"]
      name_contains: ["21.101", "СПДС", "SPDS"]
    accepted_files: ["*.pdf", "*.docx", "*.md", "*.txt"]
    needed_for:
      - "цитаты/текст требований"
      - "retrieval-подфаза doc-review"
      - "защита замечаний ссылками на норму"
    operator_action: "Добавь легальный экземпляр ГОСТ/СПДС в нормативный датасет. Без него часть пунктов останется на добор источников."
    process_label: "Проверить RAG"

  - id: normcontrol_layout_reference
    domain: normcontrol
    label: "Layout-эталон СПДС: лист/рамка/основная надпись"
    status_if_missing: degraded
    paths:
      - config/normcontrol/layout_reference.yaml
    folders:
      - config/normcontrol
    accepted_files: ["*.yaml", "*.pdf", "*.png"]
    needed_for:
      - "проверка расположения рамки"
      - "проверка зоны основной надписи"
      - "проверка заполнения граф"
    operator_action: "Нужен эталон расположения листа, рамки и основной надписи для строгой проверки граф."
    process_label: "Проверить эталон"
