# Реестр параметрических правил Glorax PD (T3.1, implementation_plan.md §3.3).
#
# Курируется вручную по РЕАЛЬНЫМ формулировкам критериев config/checklists/glorax_pd_2026.json.
# Каждое правило привязано к item_id-носителю — критерию, чья формулировка содержит конкретную
# числовую/маркировочную величину. НЕ заводить правила без критерия-носителя (см. отчёт T3.1 —
# «алюминиевые жилы для внутренних квартирных стояков» в РД имеет носитель, а гипотетические
# кратности воздухообмена/классы бетона B без явного числа в тексте ПД-критерия — НЕТ, поэтому
# такие правила здесь не заведены).
#
# Схема правила:
#   rule_id            — уникальный machine-id (snake_case)
#   item_ids            — список PD-*/RD-* item_id, к которым применяется правило (>=1)
#   parameter           — человекочитаемое имя параметра
#   operator            — >= | <= | == | contains | not_contains
#   value               — порог/эталон (число для >=/<=/== числовых, строка для ==/contains/not_contains)
#   unit                — единица (mm, класс, марка, "" для contains/not_contains без единицы)
#   synonyms            — синонимы параметра для будущего расширения поиска (не используются extract_value напрямую)
#   extract_patterns    — список regex (RU, re.IGNORECASE); первая захватывающая группа — значение

rules:
  # ── PD-AR-047: толщина стяжки пола — не менее 80 мм ──────────────────────────────────────
  # T2.6 (баг 3, SESSION_LOG Запись 19): исходные паттерны '(\d+...)\s*мм' были ЖАДНЫМИ — брали
  # ПЕРВОЕ число+мм в снипете, независимо от того, к чему оно относится (пироги полов реального
  # smoke содержат много пар "материал - N мм": "Полимочевина - 3 мм", "Плиточный клей - 10 мм",
  # "Фальш-пол - от 100 до 250 мм" и т.д. — ни одна из них не толщина стяжки). Ужесточение:
  # число матчится ТОЛЬКО в непосредственной связке со словом "стяжк*" — паттерн требует, чтобы
  # между "стяжк*" и числом+единицей не было НИКАКОГО другого числа+единицы (negative lookahead
  # в теле окна ~60 символов) — это отсекает случаи, где "стяжка" упомянута, но её собственное
  # число либо отсутствует в снипете (обрезано), либо стоит ДО слова "стяжка" (относится к
  # другому материалу/трубопроводу), и пропускает настоящую пару "стяжка ... N мм" даже если она
  # не первая в снипете (окно non-greedy ищет БЛИЖАЙШЕЕ число к "стяжка", это и есть правильное
  # значение). Реальные негативные снипеты — tests/test_checklist_param_rules.py
  # (test_screed_thickness_real_smoke_snippets_*), дословно из PD-AR-047 evidence
  # SMOKE_PD_O_FULL.json.
  - rule_id: screed_thickness_parking_min_80mm
    item_ids: [PD-AR-047]
    parameter: screed_thickness
    operator: ">="
    value: 80.0
    unit: mm
    synonyms: ["толщина стяжки", "стяжка пола"]
    extract_patterns:
      - 'стяжк\w*(?:(?!\d+(?:[.,]\d+)?\s*мм).){0,60}?(\d+(?:[.,]\d+)?)\s*мм'
      - 'стяжк\w*(?:(?!\d+(?:[.,]\d+)?\s*(?:мм|см|м)\b).){0,60}?(\d+(?:[.,]\d+)?)\s*(мм|см|м)\b'

  # ── PD-KR-020: марка бетона по водонепроницаемости для ростверка (W12) ──────────────────
  - rule_id: concrete_water_resistance_rostverk_w12
    item_ids: [PD-KR-020]
    parameter: concrete_water_resistance_grade
    operator: "=="
    value: "W12"
    unit: класс
    synonyms: ["марка бетона", "водонепроницаемость бетона", "марка по водонепроницаемости"]
    extract_patterns:
      - '\b(W\d{1,2})\b'

  # ── PD-EOM-032: огнезащита транзитных кабельных линий через паркинг — EI150 ─────────────
  - rule_id: cable_fire_protection_parking_ei150
    item_ids: [PD-EOM-032]
    parameter: fire_resistance_rating
    operator: "=="
    value: "EI150"
    unit: класс
    synonyms: ["предел огнестойкости", "огнезащита кабельных линий"]
    extract_patterns:
      - '\b(EI\s?\d{2,3})\b'

  # ── PD-KR-023: уровень грунтовых вод ниже подошвы фундамента более чем на 1 м ───────────
  - rule_id: groundwater_level_below_foundation_min_1m
    item_ids: [PD-KR-023]
    parameter: groundwater_depth_below_foundation
    operator: ">="
    value: 1000.0
    unit: mm
    synonyms: ["уровень грунтовых вод", "глубина ниже подошвы фундамента"]
    extract_patterns:
      - '(\d+(?:[.,]\d+)?)\s*(?:мм|см|м)\b'

  # ── PD-KR-036: минеральная плита деформационных швов выше отметки 0,000 м ──────────────
  # Значение в тексте всегда метры («отметки +3,300») — value/unit заданы в mm (нормализация
  # extract_value приводит все длины к mm), 0.0 м == 0.0 мм, порог не меняется при пересчёте.
  - rule_id: mineral_slab_joint_above_zero_mark
    item_ids: [PD-KR-036]
    parameter: elevation_mark_threshold
    operator: ">="
    value: 0.0
    unit: mm
    synonyms: ["отметка 0,000", "выше отметки"]
    extract_patterns:
      - 'отметк\w*\s*([+-]?\d+(?:[.,]\d+)?)\s*(м)\b'

  # ── PD-EN-016: наружные сети ЭС — кабели с алюминиевыми жилами (требование, не запрет) ──
  - rule_id: aluminium_cores_external_networks_required
    item_ids: [PD-EN-016]
    parameter: cable_core_material_external
    operator: contains
    value: "алюминиев"
    unit: ""
    synonyms: ["алюминиевые жилы", "кабель с алюминиевыми жилами"]
    extract_patterns:
      - '(алюминиев\w*\s+жил\w*)'
      - '(кабел\w*[^.]{0,25}алюминиев\w*)'

  # ── PD-EOM-037: квартирные стояки — алюминий ЗАПРЕЩЁН для классов ЖК Бизнес/Премиум ─────
  - rule_id: aluminium_cores_forbidden_business_premium
    item_ids: [PD-EOM-037]
    parameter: cable_core_material_business_premium
    operator: not_contains
    value: "алюминиев"
    unit: ""
    synonyms: ["алюминиевые жилы", "класс ЖК Бизнес", "класс ЖК Премиум"]
    extract_patterns:
      - '(алюминиев\w*\s+жил\w*)'

  # ── PD-KR-028: геотехническая документация при III (сложной) категории грунтов ─────────
  - rule_id: geotech_documentation_category_iii
    item_ids: [PD-KR-028]
    parameter: soil_complexity_category
    operator: "=="
    value: "III"
    unit: категория
    synonyms: ["категория сложности грунтов", "III категория", "сложная категория грунтов"]
    extract_patterns:
      - '\b(I{1,3}|IV)\b\s*\(?[^)]{0,20}\)?\s*категори\w*'
      - 'категори\w*[^.]{0,25}?грунт\w*[^.]{0,20}?\b(I{1,3}|IV)\b'
      - 'грунт\w*[^.]{0,25}?категори\w*[^.]{0,10}?\b(I{1,3}|IV)\b'

  # ── PD-PB2-019: степень огнестойкости здания (СП 118.13330.2022) ───────────────────────
  - rule_id: building_fire_resistance_degree
    item_ids: [PD-PB2-019]
    parameter: building_fire_resistance_degree
    operator: contains
    value: "степень огнестойкости"
    unit: степень
    synonyms: ["степень огнестойкости здания"]
    extract_patterns:
      - '\b([IVX]+)\s*степен\w*\s*огнестойкост\w*'

  # ── PD-VK-042: расположение по СП 30.13330.2020 п.11.18 (нормативный пункт, не число-величина) ──
  # NB: правило-кандидат НЕ заведено как parametric-сравнение (нет извлекаемой величины в тексте
  # самого критерия помимо ссылки на пункт СП) — см. отчёт, item остаётся spatial_visual/manual.
