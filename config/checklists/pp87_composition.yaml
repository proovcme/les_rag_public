meta:
  version: 1
  title: "Состав проектной документации — ПП РФ №87 от 16.02.2008"
  note: >
    Перечень разделов проектной документации объектов капитального строительства по п.12
    Положения (приложение к Постановлению Правительства РФ от 16.02.2008 N 87, действующая
    редакция). Список ограничен уверенно проверяемыми по знанию разделами — спорные/сильно
    зависящие от вида объекта позиции (энергоэффективность, смета, ПОД снос) помечены
    required: conditional, не выдумываются "на всякий случай". Используется детерминированным
    composition-checker'ом (proxy/services/pp87_composition_service.py, T2.5) — сопоставление
    ведётся ТОЛЬКО по имени файла в inventory датасета (регэксп filename_patterns), без похода в
    LLM/RAG. Реальные имена файлов корпуса ПД имеют вид «Раздел ПД №N. Часть M. <код><...>» —
    паттерны ищут номер раздела как «Раздел ПД №N» (без привязки к регистру/пробелам).

sections:
  - code: "1"
    title: "Пояснительная записка (ПЗ)"
    required: always
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*1\\b"
      - "\\bпз\\b"
      - "пояснительн\\w*\\s+записк\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 1"

  - code: "2"
    title: "Схема планировочной организации земельного участка (СПОЗУ/ПЗУ)"
    required: always
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*2\\b"
      - "\\bспозу\\b"
      - "\\bпзу\\b"
      - "схема\\s+планировочной\\s+организации"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 2"

  - code: "3"
    title: "Архитектурные решения (АР)"
    required: always
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*3\\b"
      - "\\bар\\d*\\b"
      - "архитектурн\\w*\\s+решени\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 3"

  - code: "4"
    title: "Конструктивные и объемно-планировочные решения (КР)"
    required: always
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*4\\b"
      - "\\bкр\\d*\\b"
      - "конструктивн\\w*\\s+решени\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 4"

  - code: "5"
    title: "Сведения об инженерном оборудовании, сетях инженерно-технического обеспечения, перечень инженерно-технических мероприятий (ИОС)"
    required: always
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*5\\b"
      - "\\bиос\\d*\\b"
      - "инженерн\\w*\\s+оборудован\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 5"

  - code: "5.1"
    title: "ИОС1 — система электроснабжения (ЭС/ЭОМ)"
    required: conditional
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*5[.\\s]*1\\b"
      - "\\bиос1\\b"
      - "\\bэом\\d*\\b"
      - "\\bэс\\d*\\b"
      - "электроснабжен\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 5 (подраздел 1)"

  - code: "5.2"
    title: "ИОС2 — система водоснабжения (ВС)"
    required: conditional
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*5[.\\s]*2\\b"
      - "\\bиос2\\b"
      - "\\bвс\\d*\\b"
      - "водоснабжен\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 5 (подраздел 2)"

  - code: "5.3"
    title: "ИОС3 — система водоотведения (ВО)"
    required: conditional
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*5[.\\s]*3\\b"
      - "\\bиос3\\b"
      - "\\bво\\d*\\b"
      - "водоотведен\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 5 (подраздел 3)"

  - code: "5.4"
    title: "ИОС4 — отопление, вентиляция и кондиционирование воздуха (ОВ)"
    required: conditional
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*5[.\\s]*4\\b"
      - "\\bиос4\\b"
      - "\\bов\\d*\\b"
      - "отоплен\\w*.{0,20}вентиляц\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 5 (подраздел 4)"

  - code: "5.5"
    title: "ИОС5 — сети связи (СС)"
    required: conditional
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*5[.\\s]*5\\b"
      - "\\bиос5\\b"
      - "\\bсс\\d*\\b"
      - "сети\\s+связи"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 5 (подраздел 5)"

  - code: "5.6"
    title: "ИОС6 — технологические решения по газоснабжению (ГС)"
    required: conditional
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*5[.\\s]*6\\b"
      - "\\bиос6\\b"
      - "\\bгс\\d*\\b"
      - "газоснабжен\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 5 (подраздел 6)"

  - code: "5.7"
    title: "ИОС7 — технологические решения (ТХ)"
    required: conditional
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*5[.\\s]*7\\b"
      - "\\bиос7\\b"
      - "\\bтх\\d*\\b"
      - "технологические\\s+решени\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 5 (подраздел 7)"

  - code: "6"
    title: "Проект организации строительства (ПОС)"
    required: always
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*6\\b"
      - "\\bпос\\d*\\b"
      - "проект\\s+организации\\s+строительства"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 6"

  - code: "7"
    title: "Проект организации работ по сносу или демонтажу объектов капитального строительства (ПОД)"
    required: conditional
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*7\\b"
      - "\\bпод\\d*\\b"
      - "снос\\w*\\s+объект\\w*"
      - "демонтаж\\w*\\s+объект\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 7 (при необходимости сноса/демонтажа)"

  - code: "8"
    title: "Перечень мероприятий по охране окружающей среды (ООС)"
    required: always
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*8\\b"
      - "\\bоос\\d*\\b"
      - "охран\\w*\\s+окружающ\\w*\\s+сред\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 8"

  - code: "9"
    title: "Мероприятия по обеспечению пожарной безопасности (ПБ)"
    required: always
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*9\\b"
      - "\\bпб\\d*\\b"
      - "пожарн\\w*\\s+безопасност\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 9"

  - code: "10"
    title: "Мероприятия по обеспечению доступа инвалидов (ОДИ)"
    required: always
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*10\\b"
      - "\\bоди\\d*\\b"
      - "доступ\\w*\\s+инвалид\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 10"

  - code: "10.1"
    title: "Мероприятия по обеспечению соблюдения требований энергетической эффективности и требований оснащенности приборами учета (ЭЭ)"
    required: conditional
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*10[.\\s]*1\\b"
      - "\\bээ\\d*\\b"
      - "энергетическ\\w*\\s+эффективност\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 10.1"

  - code: "11"
    title: "Смета на строительство объектов капитального строительства (СМ)"
    required: conditional
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*11\\b"
      - "\\bсм\\d*\\b"
      - "смета\\s+на\\s+строительств\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 11 (при необходимости, ст.48 ГрК РФ)"

  - code: "12"
    title: "Иная документация в случаях, предусмотренных федеральными законами"
    required: conditional
    filename_patterns:
      - "раздел\\s*пд\\s*№?\\s*12\\b"
      - "иная\\s+документаци\\w*"
    requirement_ref: "ПП РФ №87 от 16.02.2008, п.12, раздел 12"
