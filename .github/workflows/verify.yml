name: platform-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: platform-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-native-build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            runner: macos-14
            binary: desktop/tauri/src-tauri/target/release/les-desktop
          - platform: windows-x64
            runner: windows-2022
            binary: desktop/tauri/src-tauri/target/release/les-desktop.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri/src-tauri

      - name: Sync frozen Python environment
        run: uv sync --frozen

      - name: Restore verified smeta test baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -c "from pathlib import Path; Path('dist').mkdir(exist_ok=True)"
          gh release download ci-smeta-baseline-20260728 --pattern LES-smeta-baseline.zip --dir dist --clobber
          uv run python -m tools.smeta_release_baseline verify --archive dist/LES-smeta-baseline.zip
          uv run python -m tools.smeta_release_baseline provision --archive dist/LES-smeta-baseline.zip --state-root .

      - name: Verify version, imports and test collection
        run: uv run python tools/platform_release_gate.py verify

      - name: Run canonical LES tests
        run: uv run python tools/platform_release_gate.py test

      - name: Build native Tauri shell
        run: uv run python tools/platform_release_gate.py build

      - name: Upload native shell proof
        uses: actions/upload-artifact@v4
        with:
          name: les-native-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14
