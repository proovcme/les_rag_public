name: Проверка исходного кода

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv и Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Восстановить закреплённое окружение
        run: uv sync --frozen

      - name: Проверить версии, синтаксис и сбор тестов
        run: make verify

      - name: Выполнить быстрые модульные тесты
        run: make test-unit
