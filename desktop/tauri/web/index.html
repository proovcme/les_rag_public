<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ЛЕС · Совушка</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1412; color: #edf4ef; }
    main { width: min(440px, calc(100vw - 48px)); text-align: center; }
    .mark { width: 72px; height: 72px; margin: 0 auto 24px; display: grid; place-items: center; border: 1px solid #335c49; border-radius: 22px; background: #17221d; font-size: 38px; }
    h1 { margin: 0; font-size: 24px; letter-spacing: .04em; }
    p { margin: 10px 0 0; color: #9fb0a7; font-size: 14px; line-height: 1.5; }
    .bar { height: 4px; margin: 28px 0 0; overflow: hidden; border-radius: 99px; background: #233129; }
    .bar::after { content: ""; display: block; width: 42%; height: 100%; border-radius: inherit; background: #4faa77; animation: load 1.15s ease-in-out infinite; }
    @keyframes load { from { transform: translateX(-110%); } to { transform: translateX(340%); } }
  </style>
</head>
<body>
  <main>
    <div class="mark">🌲</div>
    <h1>Л.Е.С.</h1>
    <p>Поднимаю Qdrant, модель, proxy и Совушку.<br>На первом запуске это может занять несколько минут.</p>
    <div class="bar" aria-label="Запуск"></div>
  </main>
</body>
</html>
