<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176b46">
  <title>Совушка · нет соединения</title>
  <style>
    :root { color-scheme: light dark; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; color: #17211b; background: #f4f6f2; }
    main { width: min(560px, calc(100vw - 32px)); box-sizing: border-box; padding: 28px; border: 1px solid #cbd5ce; border-radius: 14px; background: #fff; }
    .mark { color: #176b46; font-size: 14px; font-weight: 800; letter-spacing: .06em; }
    h1 { margin: 16px 0 8px; font-size: clamp(24px, 6vw, 34px); line-height: 1.15; }
    p { margin: 0 0 20px; color: #526159; font-size: 16px; line-height: 1.5; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
    textarea { width: 100%; min-height: 150px; box-sizing: border-box; resize: vertical; padding: 12px; border: 1px solid #839189; border-radius: 9px; color: inherit; background: transparent; font: inherit; line-height: 1.5; }
    textarea:focus-visible { outline: 2px solid #176b46; outline-offset: 2px; }
    .status { margin-top: 8px; color: #526159; font-size: 12px; }
    @media (prefers-color-scheme: dark) { body { color: #eef4f0; background: #111713; } main { border-color: #405047; background: #1a231e; } p, .status { color: #b6c2ba; } textarea { border-color: #718078; } }
  </style>
</head>
<body>
  <main>
    <div class="mark">С.О.В.У.Ш.К.А. · Л.Е.С.</div>
    <h1>Узел Л.Е.С. сейчас недоступен</h1>
    <p>Проверьте соединение и откройте Совушку снова. Запросы автоматически не отправляются.</p>
    <label for="draft">Черновик сообщения</label>
    <textarea id="draft" placeholder="Можно продолжить формулировать задачу…"></textarea>
    <div class="status" id="status">Черновик сохранён только на этом устройстве.</div>
  </main>
  <script>
    const key = 'sovushka.offlineDraft.v1';
    const draft = document.getElementById('draft');
    draft.value = localStorage.getItem(key) || '';
    draft.addEventListener('input', () => localStorage.setItem(key, draft.value));
  </script>
</body>
</html>
